:root{
  --paper:#f6efdc; --paper2:#efe5cb; --ink:#23312b; --muted:#5d6b62; --pine:#1f4d3a; --pine2:#2d6a4f; --pine3:#dcebe2;
  --sun:#f08a24; --sun2:#ffd166; --sky:#bfe0ea; --snow:#fffdf6; --stone:#e4dfd0; --stone2:#cfc8b3;
  --good:#238a54; --goodbg:#ddf3e5; --bad:#c2452d; --badbg:#fbe3dc; --blue:#2b6cb0; --berry:#b83f56;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520' viewBox='0 0 520 520'><g fill='none' stroke='%23d9cdb0' stroke-width='1.4' opacity='.75'><path d='M-20 120C60 60 140 150 230 100S400 40 540 110'/><path d='M-20 150C60 96 140 180 230 134S400 82 540 146'/><path d='M-20 180C60 132 140 210 230 168S400 124 540 182'/><path d='M-20 360C80 300 150 400 260 340S430 290 540 350'/><path d='M-20 392C80 336 150 432 260 374S430 328 540 386'/><path d='M-20 424C80 372 150 464 260 408S430 366 540 422'/><ellipse cx='400' cy='260' rx='60' ry='36'/><ellipse cx='400' cy='260' rx='38' ry='21'/><ellipse cx='400' cy='260' rx='16' ry='8'/></g></svg>");
  min-height:100vh;-webkit-text-size-adjust:100%;font-size:17px;line-height:1.45}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif}
#app{max-width:1120px;margin:0 auto;padding:0 0 40px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;
  box-shadow:0 3px 0 rgba(0,0,0,.12);flex-wrap:wrap}
#hud .brand{font-family:Lora,serif;font-weight:700;font-size:18px;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
#hud .brand small{font-family:Poppins,sans-serif;font-weight:500;opacity:.8;font-size:12px;display:block;line-height:1}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
#gear{background:rgba(255,255,255,.18);width:40px;height:40px;border-radius:50%;font-size:20px;color:#fff}
#trail{background:linear-gradient(#e9f4f7,#f6efdc);border-bottom:2px solid var(--stone2);padding:2px 14px 0}
#trail svg{width:100%;height:50px;display:block}

/* ---------- cards ---------- */
#stage{padding:16px 14px}
.card{background:var(--snow);border:2px solid var(--stone2);border-left:10px solid var(--pine2);border-radius:var(--r);padding:18px 20px;box-shadow:0 6px 0 rgba(31,77,58,.10)}
.card.center{text-align:center;border-left-width:2px;border-top:10px solid var(--pine2)}
.card h1{font-size:clamp(28px,5vw,44px);margin:6px 0 4px;line-height:1.1;color:var(--pine)}
.card h2{font-size:clamp(22px,3.4vw,30px);margin:4px 0 8px;color:var(--pine)}
.card p{margin:8px 0}
.sub{color:var(--muted);font-weight:500}
.big-emoji{font-size:64px;line-height:1;margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:14px;font-weight:700;background:var(--sun);color:#2a1a05;
  box-shadow:0 4px 0 #b9650f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9650f}
.btn.alt{background:var(--pine);color:#fff;box-shadow:0 4px 0 #11291f}
.btn.alt:active{box-shadow:0 1px 0 #11291f}
.btn.ghost{background:var(--stone);color:var(--ink);box-shadow:0 4px 0 var(--stone2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.grow{flex:1}
input.name{font:inherit;font-size:20px;padding:12px 16px;border:3px solid var(--stone2);border-radius:14px;width:min(100%,340px);background:#fff;text-align:center}
input.name:focus{outline:none;border-color:var(--sun)}
.avatars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.av{width:58px;height:58px;font-size:32px;background:var(--stone);border-radius:50%;border:3px solid transparent}
.av.sel{border-color:var(--sun);background:var(--sun2)}
.beat{font-size:19px;margin:14px 0}
.sidekick{display:flex;gap:12px;align-items:flex-start;background:var(--pine3);border-radius:16px;padding:10px 14px;margin:12px 0}
.sidekick .face{font-size:34px;line-height:1}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--stone2);display:block}
.dots i.on{background:var(--sun)}

/* ---------- question ---------- */
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-weight:600;font-size:14px}
.chip{background:var(--pine3);color:var(--pine);border-radius:999px;padding:2px 12px;font-weight:600;font-size:13px}
.chip.gold{background:var(--sun2);color:#6b4300}
.qbody{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:880px){.qbody.has-fig{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.qleft{min-width:0}
.fig{background:#fff;border:2px solid var(--stone2);border-radius:14px;padding:8px;text-align:center}
.fig svg{max-width:100%;height:auto;width:auto;display:inline-block;touch-action:manipulation}
.fig2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figcap{font-weight:700;font-size:14px;margin-bottom:2px}
.prompt{font-size:19px;margin:0 0 12px}
.prompt b{color:var(--pine)}
.fmt{display:block;font-size:14px;color:var(--muted);margin-top:4px}
table.tbl{border-collapse:collapse;margin:6px auto;font-size:18px}
table.tbl th,table.tbl td{border:2px solid var(--stone2);padding:8px 14px;min-width:46px;text-align:center}
table.tbl th{background:var(--pine3);color:var(--pine)}
table.tbl td.qcell{background:var(--sun2);font-weight:700}

.ansrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ansbox{min-width:150px;min-height:56px;border:3px solid var(--stone2);background:#fff;border-radius:14px;padding:8px 16px;font-size:28px;font-weight:700;color:var(--pine);
  display:flex;align-items:center;font-variant-numeric:tabular-nums}
.ansbox.active{border-color:var(--sun);box-shadow:0 0 0 4px rgba(240,138,36,.25)}
.ansbox.ok{border-color:var(--good);background:var(--goodbg)}
.ansbox.no{border-color:var(--bad);background:var(--badbg)}
.ansbox .ph{color:#b9b29c;font-weight:500}
.unit{color:var(--muted);font-weight:600}
.mfields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mfield label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 2px 4px}
.mfield .ansbox{min-width:0;font-size:26px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:8px 0 12px}
.key{min-height:56px;border-radius:12px;background:var(--stone);font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--stone2);color:var(--ink)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stone2)}
.key.fn{background:var(--pine3);color:var(--pine)}
.key.und{grid-column:span 2;font-size:17px;background:var(--sun2);box-shadow:0 3px 0 #d9ac3c}
.key.blank{visibility:hidden}
.opts{display:grid;gap:10px;margin-bottom:12px}
.opt{text-align:left;background:#fff;border:3px solid var(--stone2);border-radius:14px;padding:12px 16px;font-weight:600;font-size:18px;min-height:54px;color:var(--ink)}
.opt.sel{border-color:var(--sun);background:#fff3de}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.gone{opacity:.35;text-decoration:line-through;pointer-events:none}
.crow{background:#fff;border:2px solid var(--stone2);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.crow .cl{font-weight:600;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cc{padding:8px 12px;border-radius:999px;background:var(--stone);font-weight:600;font-size:15px;min-height:42px}
.cc.sel{background:var(--sun2);box-shadow:inset 0 0 0 3px var(--sun)}
.cc.ok{background:var(--goodbg);box-shadow:inset 0 0 0 3px var(--good)}
.cc.no{background:var(--badbg);box-shadow:inset 0 0 0 3px var(--bad)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.slot{min-width:70px;min-height:56px;border:3px dashed var(--stone2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;color:var(--pine);position:relative}
.slot.fill{border-style:solid;border-color:var(--pine2);background:var(--pine3)}
.slot.ok{border-color:var(--good);background:var(--goodbg)}
.slot.no{border-color:var(--bad);background:var(--badbg)}
.slot small{position:absolute;top:-9px;left:6px;background:var(--snow);padding:0 4px;font-size:11px;color:var(--muted)}
.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tok{min-width:70px;min-height:56px;border-radius:12px;background:var(--sun2);font-size:22px;font-weight:700;box-shadow:0 3px 0 #d9ac3c;padding:0 14px;color:#4a3000}
.tok.used{opacity:.25;pointer-events:none}
.hitmark{fill:var(--sun);stroke:#fff;stroke-width:2}
.pickline{font-weight:700;color:var(--pine);margin:8px 0;min-height:28px}
.fb{margin:10px 0;border-radius:14px;padding:10px 14px;font-weight:600}
.fb.ok{background:var(--goodbg);color:#14522f}
.fb.no{background:var(--badbg);color:#7c2514}
.fb.info{background:#fff3de;color:#6b4300}
.fb .ex{font-weight:400;color:var(--ink);display:block;margin-top:4px}
.bubble{display:flex;gap:10px;align-items:flex-start;background:#fff3de;border:2px solid #f3cf8d;border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px}
.bubble .face{font-size:28px;line-height:1.1}
.power{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pw{display:flex;align-items:center;gap:6px;background:var(--pine3);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;min-height:44px;color:var(--pine)}
.pw b{background:var(--pine);color:#fff;border-radius:999px;min-width:22px;text-align:center;padding:0 6px;font-size:13px}
.pw.armed{background:var(--sun2);box-shadow:inset 0 0 0 3px var(--sun);color:#5a3a00}
.pw[disabled]{opacity:.4;pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pine);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- field guide ---------- */
.guide{background:#fffbea;border:2px solid #ecd9a0;border-left:10px solid var(--sun)}
.guide .tag{display:inline-block;background:var(--sun2);color:#6b4300;font-weight:700;font-size:13px;border-radius:999px;padding:2px 12px}
.guide .figwrap{background:#fff;border:2px solid var(--stone2);border-radius:14px;padding:8px;text-align:center;margin:10px 0}
.guide .figwrap svg{max-width:100%;height:auto}
.formula{font-size:24px;font-weight:700;text-align:center;margin:12px 0;color:var(--pine)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 6px;font-size:.8em}
.frac i{font-style:normal;padding:0 6px}
.frac b{display:block;height:2px;background:var(--pine)}
ul.tricks{padding-left:22px;margin:8px 0}
ul.tricks li{margin:6px 0}
.lab{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media (min-width:700px){.lab{grid-template-columns:auto 1fr}}
.labctl{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.labctl .nm{font-weight:700;color:var(--pine)}
.step{min-height:50px;min-width:60px;background:var(--pine);color:#fff;font-weight:700;font-size:22px;border-radius:12px}
.step.minus{background:var(--berry)}
.labtxt{background:#fff;border:2px solid var(--stone2);border-radius:14px;padding:10px 14px;grid-column:1/-1;font-weight:600}
.tsel{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbtn{background:var(--stone);border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.tbtn.on{background:var(--pine);color:#fff}

/* ---------- camp clear / report ---------- */
.stars{font-size:46px;letter-spacing:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--pine3);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pine);font-family:Lora,serif}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.crates{display:flex;gap:12px;justify-content:center;margin:12px 0}
.crate{width:96px;height:86px;font-size:44px;background:var(--sun2);border-radius:14px;box-shadow:0 5px 0 #d9ac3c;font-weight:700}
.crate.open{background:#fff;box-shadow:none;font-size:15px;line-height:1.2;padding:6px}
table.rep{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:15px}
table.rep th,table.rep td{padding:8px 10px;border-bottom:2px solid var(--stone);text-align:left}
table.rep th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.badge{background:var(--pine3);border-radius:14px;padding:10px;text-align:center;font-size:14px;font-weight:600}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge .e{font-size:30px;display:block}
.missed{background:#fff;border:2px solid var(--stone2);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px}
.rank{font-family:Lora,serif;font-size:30px;color:var(--pine);font-weight:700}

/* ---------- modal ---------- */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,35,28,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on{display:flex}
#modal .sheet{background:var(--snow);border-radius:20px;padding:18px 20px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
#modal select{font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid var(--stone2);background:#fff;max-width:100%}
.sw{display:flex;align-items:center;gap:10px;margin:10px 0}

.pick-layer{pointer-events:none}

pe": "multi", "prompt": "Find the slope of the line through <b>(2, 3)<\/b> and <b>(6, 11)<\/b>. Rise = y₂ − y₁ and run = x₂ − x₁, using (6, 11) as point 2.", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = 11 − 3 = 8. Run = x₂ − x₁ = 6 − 2 = 4. Slope = 8/4 = <b>2<\/b> (simplified).", "ansText": "rise = 8, run = 4, slope = 2", "fast": 55, "fields": [{"label": "Rise", "ans": {"n": 8, "d": 1}, "kind": "int"}, {"label": "Run", "ans": {"n": 4, "d": 1}, "kind": "int"}, {"label": "Slope", "ans": {"n": 2, "d": 1}, "kind": "frac"}]}, {"id": "c2-1-3", "skill": "twopts", "type": "multi", "prompt": "Find the slope of the line through <b>(−1, 5)<\/b> and <b>(3, −1)<\/b>. Rise = y₂ − y₁ and run = x₂ − x₁, using (3, −1) as point 2.", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = (−1) − 5 = −6. Run = x₂ − x₁ = 3 − (−1) = 4. Slope = −6/4 = <b>−3/2<\/b> (simplified).", "ansText": "rise = −6, run = 4, slope = −3/2", "fast": 55, "fields": [{"label": "Rise", "ans": {"n": -6, "d": 1}, "kind": "int"}, {"label": "Run", "ans": {"n": 4, "d": 1}, "kind": "int"}, {"label": "Slope", "ans": {"n": -3, "d": 2}, "kind": "frac"}]}, {"id": "c2-1-4", "skill": "twopts", "type": "multi", "prompt": "Find the slope of the line through <b>(−4, −2)<\/b> and <b>(2, 1)<\/b>. Rise = y₂ − y₁ and run = x₂ − x₁, using (2, 1) as point 2.", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = 1 − (−2) = 3. Run = x₂ − x₁ = 2 − (−4) = 6. Slope = 3/6 = <b>1/2<\/b> (simplified).", "ansText": "rise = 3, run = 6, slope = 1/2", "fast": 55, "fields": [{"label": "Rise", "ans": {"n": 3, "d": 1}, "kind": "int"}, {"label": "Run", "ans": {"n": 6, "d": 1}, "kind": "int"}, {"label": "Slope", "ans": {"n": 1, "d": 2}, "kind": "frac"}]}, {"id": "c2-1-5", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(0, −3)<\/b> and <b>(5, 1)<\/b>. <span class='fmt'>Whole number or simplified fraction (or <i>undefined<\/i>).<\/span>", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = 1 − (−3) = 4. Run = x₂ − x₁ = 5 − 0 = 5. Slope = rise ÷ run = <b>4/5<\/b>.", "ansText": "4/5", "fast": 40, "ans": {"n": 4, "d": 5}, "allowUndef": true}, {"id": "c2-1-6", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(−6, 4)<\/b> and <b>(−2, −4)<\/b>. <span class='fmt'>Whole number or simplified fraction (or <i>undefined<\/i>).<\/span>", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = (−4) − 4 = −8. Run = x₂ − x₁ = (−2) − (−6) = 4. Slope = −8/4 = <b>−2<\/b> (simplified).", "ansText": "−2", "fast": 40, "ans": {"n": -2, "d": 1}, "allowUndef": true}, {"id": "c2-1-7", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(7, −1)<\/b> and <b>(−2, 5)<\/b>. <span class='fmt'>Whole number or simplified fraction (or <i>undefined<\/i>).<\/span>", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = 5 − (−1) = 6. Run = x₂ − x₁ = (−2) − 7 = −9. Slope = 6/−9 = <b>−2/3<\/b> (simplified).", "ansText": "−2/3", "fast": 40, "ans": {"n": -2, "d": 3}, "allowUndef": true}, {"id": "c2-1-8", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(−8, −3)<\/b> and <b>(4, 6)<\/b>. <span class='fmt'>Whole number or simplified fraction (or <i>undefined<\/i>).<\/span>", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Rise = y₂ − y₁ = 6 − (−3) = 9. Run = x₂ − x₁ = 4 − (−8) = 12. Slope = 9/12 = <b>3/4<\/b> (simplified).", "ansText": "3/4", "fast": 40, "ans": {"n": 3, "d": 4}, "allowUndef": true}, {"id": "c2-1-9", "skill": "twopts", "type": "choice", "prompt": "Jordan finds the slope through (1, 2) and (4, 8) but starts with the <b>second<\/b> point: (2 − 8) ÷ (1 − 4). Does the answer change?", "hint": "Work it out: (2 − 8) = −6 and (1 − 4) = −3.", "explain": "(2 − 8) ÷ (1 − 4) = −6 ÷ −3 = <b>2<\/b>. Two negatives make a positive, so the order doesn't matter if you stay consistent.", "ansText": "No — it's still 2, as long as both subtractions use the same order", "fast": 20, "options": ["Yes — it becomes −2", "No — it's still 2, as long as both subtractions use the same order", "Yes — it becomes 1/2", "No — but it is undefined"], "correct": 1}]}, {"id": 2, "name": "Table Tunnel", "sub": "Slope from a Table", "icon": "📋", "skill": "table", "story": "The train rumbles into a tunnel lined with giant number tables. “The speed controls are hidden in the patterns,” whispers Flurry.", "clue": "🛤️ Track piece 2 clicked into place.", "briefing": [{"t": "Slope from a table", "h": "Pick two columns and compare. Table: x = 1, 3, 5, 7 and y = 2, 8, 14, 20.<br>Between x = 1 and x = 3: change in y = 8 − 2 = 6, change in x = 3 − 1 = 2, slope = 6/2 = <b>3<\/b>.<br>Check another pair: (20 − 14) ÷ (7 − 5) = 6/2 = 3 ✓. The rate is <b>constant<\/b>.", "svg": "<table class=\"tbl\"><tr><th>x<\/th><td>1<\/td><td>3<\/td><td>5<\/td><td>7<\/td><\/tr><tr><th>y<\/th><td>2<\/td><td>8<\/td><td>14<\/td><td>20<\/td><\/tr><\/table>"}, {"t": "Is it a straight line?", "h": "If every pair of columns gives the <b>same<\/b> slope, the rate is constant and the points make a straight line. If the slopes are different, the relationship is <b>not linear<\/b>."}], "questions": [{"id": "c2-2-1", "skill": "table", "type": "num", "prompt": "Find the <b>slope<\/b> (rate of change) shown in the table. <span class='fmt'>Whole number or simplified fraction.<\/span>", "hint": "Pick any two columns. Divide the change in y by the change in x.", "explain": "Pick two rows, like (0, 3) and (2, 7). Change in y = 7 − 3 = 4. Change in x = 2 − 0 = 2. Slope = 4/2 = <b>2<\/b>.", "ansText": "2", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>0<\/td><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><th>y<\/th><td>3<\/td><td>7<\/td><td>11<\/td><td>15<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": 2, "d": 1}, "allowUndef": false}, {"id": "c2-2-2", "skill": "table", "type": "num", "prompt": "Find the <b>slope<\/b> (rate of change) shown in the table. <span class='fmt'>Whole number or simplified fraction.<\/span>", "hint": "Pick any two columns. Divide the change in y by the change in x.", "explain": "Pick two rows, like (1, 10) and (2, 7). Change in y = 7 − 10 = −3. Change in x = 2 − 1 = 1. Slope = −3/1 = <b>−3<\/b>.", "ansText": "−3", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>y<\/th><td>10<\/td><td>7<\/td><td>4<\/td><td>1<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": -3, "d": 1}, "allowUndef": false}, {"id": "c2-2-3", "skill": "table", "type": "num", "prompt": "Find the <b>slope<\/b> (rate of change) shown in the table. <span class='fmt'>Whole number or simplified fraction.<\/span>", "hint": "Pick any two columns. Divide the change in y by the change in x.", "explain": "Pick two rows, like (0, 2) and (5, 5). Change in y = 5 − 2 = 3. Change in x = 5 − 0 = 5. Slope = 3/5 = <b>3/5<\/b>.", "ansText": "3/5", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>0<\/td><td>5<\/td><td>10<\/td><td>15<\/td><\/tr><tr><th>y<\/th><td>2<\/td><td>5<\/td><td>8<\/td><td>11<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": 3, "d": 5}, "allowUndef": false}, {"id": "c2-2-4", "skill": "table", "type": "num", "prompt": "This table shows a <b>constant rate of change<\/b>. Find the missing <b>y<\/b>-value (the ?).", "hint": "First find the slope from two complete columns. Then use it to step from a known column to the ?.", "explain": "The rate is constant. Use two known columns to find it: (2, 5) and (4, 9) give slope 2. From x = 4 to x = 6, y changes by 2 × 2. So the missing y is <b>13<\/b>.", "ansText": "13", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>2<\/td><td>4<\/td><td>6<\/td><td>8<\/td><\/tr><tr><th>y<\/th><td>5<\/td><td>9<\/td><td class=\"qcell\">?<\/td><td>17<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": 13, "d": 1}, "allowUndef": false}, {"id": "c2-2-5", "skill": "table", "type": "choice", "prompt": "Is the <b>rate of change constant<\/b> in this table?", "hint": "Check how much y changes each time x goes up by 1.", "explain": "x goes up by 1 each time, but y changes by +3, +4, +5. The rate isn't constant, so the points are <b>not<\/b> on one straight line.", "ansText": "No — y goes up by 3, then 4, then 5", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>y<\/th><td>2<\/td><td>5<\/td><td>9<\/td><td>14<\/td><\/tr><\/table>", "fast": 20, "options": ["No — x isn't changing", "Yes — it is always 4", "No — y goes up by 3, then 4, then 5", "Yes — it is always 3"], "correct": 2}, {"id": "c2-2-6", "skill": "table", "type": "num", "prompt": "Find the <b>slope<\/b> (rate of change) shown in the table. <span class='fmt'>Whole number or simplified fraction.<\/span>", "hint": "Pick any two columns. Divide the change in y by the change in x.", "explain": "Pick two rows, like (−4, 7) and (−2, 4). Change in y = 4 − 7 = −3. Change in x = −2 − (−4) = 2. Slope = −3/2 = <b>−3/2<\/b>.", "ansText": "−3/2", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>−4<\/td><td>−2<\/td><td>0<\/td><td>2<\/td><\/tr><tr><th>y<\/th><td>7<\/td><td>4<\/td><td>1<\/td><td>−2<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": -3, "d": 2}, "allowUndef": false}, {"id": "c2-2-7", "skill": "table", "type": "num", "prompt": "Find the <b>slope<\/b> (rate of change) shown in the table. <span class='fmt'>Whole number or simplified fraction.<\/span>", "hint": "x doesn't go up by the same amount each time — that's fine! Divide the change in y by the change in x for any two columns.", "explain": "Pick two rows, like (1, 3) and (4, 9). Change in y = 9 − 3 = 6. Change in x = 4 − 1 = 3. Slope = 6/3 = <b>2<\/b>.", "ansText": "2", "figure": "<table class=\"tbl\"><tr><th>x<\/th><td>1<\/td><td>4<\/td><td>6<\/td><td>10<\/td><\/tr><tr><th>y<\/th><td>3<\/td><td>9<\/td><td>13<\/td><td>21<\/td><\/tr><\/table>", "fast": 40, "ans": {"n": 2, "d": 1}, "allowUndef": false}]}, {"id": 3, "name": "Rate Rail", "sub": "Rates in the Real World", "icon": "🚠", "skill": "rate", "story": "Cable cars swing above the glacier. “Every cabin has a speed label,” says Flurry. “We need the rate of change, with the right units!”", "clue": "🛤️ Track piece 3 clicked into place.", "briefing": [{"t": "Rate of change with units", "h": "A plane climbs from 3,000 ft to 9,000 ft in 12 min.<br>Rate = change in height ÷ change in time = 6,000 ÷ 12 = <b>500 feet per minute<\/b>.<br><br>Always say the <b>units<\/b>: (dependent units) <b>per<\/b> (independent unit)."}, {"t": "Positive, negative, unit rate", "h": "<ul class='tricks'><li>Increasing amount → <b>positive<\/b> rate.<\/li><li>Decreasing amount (draining, melting, sinking) → <b>negative<\/b> rate.<\/li><li>A <b>unit rate<\/b> like “$3 per bag” is the slope of a line through (0, 0).<\/li><\/ul>"}], "questions": [{"id": "c2-3-1", "skill": "rate", "type": "num", "prompt": "A hiker climbs from <b>1,200 m<\/b> to <b>1,500 m<\/b> in <b>30 minutes<\/b>. What is the rate of change in meters per minute?", "hint": "Rate = change in elevation ÷ change in time.", "explain": "(1,500 − 1,200) ÷ 30 = 300 ÷ 30 = <b>10<\/b> meters per minute.", "ansText": "10 m per min", "fast": 40, "ans": {"n": 10, "d": 1}, "allowUndef": false, "unit": "m per min"}, {"id": "c2-3-2", "skill": "rate", "type": "num", "prompt": "The graph shows the water left in a draining tank. What is the rate of change in liters per minute?", "hint": "Pick two points: (0, 60) and (10, 0). Careful with the y-axis scale!", "explain": "Rise = y₂ − y₁ = 0 − 60 = −60. Run = x₂ − x₁ = 10 − 0 = 10. Slope = −60/10 = <b>−6<\/b> (simplified). The rate is negative because the water is <b>decreas ard,” says Flurry. “Can you find them?”", "clue": "🛤️ Track piece 5 clicked into place.", "briefing": [{"t": "Flat lines and wall lines", "h": "<ul class='tricks'><li><b>y = a number<\/b> (like y = 4) is a <b>horizontal<\/b> line: slope <b>0<\/b>.<\/li><li><b>x = a number<\/b> (like x = 3) is a <b>vertical<\/b> line: slope <b>undefined<\/b>.<\/li><\/ul>"}, {"t": "Finding a missing coordinate", "h": "Slope between (1, 3) and (4, y) is <b>2/3<\/b>. Run = 4 − 1 = 3. Slope 2/3 means rise 2 for run 3, so y = 3 + 2 = <b>5<\/b>.<br>Write: (y − 3) ÷ (4 − 1) = 2/3, so y − 3 = 2."}], "questions": [{"id": "c2-5-1", "skill": "special", "type": "choice", "prompt": "What is the slope of the line <b>y = 5<\/b>?", "hint": "y = 5 is a flat line across the graph.", "explain": "<b>y = 5<\/b> is a horizontal line, so the slope is <b>0<\/b>.", "ansText": "Zero (0)", "fast": 20, "options": ["1", "Zero (0)", "5", "Undefined"], "correct": 1}, {"id": "c2-5-2", "skill": "special", "type": "choice", "prompt": "What is the slope of the line <b>x = −2<\/b>?", "hint": "x = −2 is a line standing straight up and down.", "explain": "<b>x = −2<\/b> is a vertical line, so the slope is <b>undefined<\/b>.", "ansText": "Undefined", "fast": 20, "options": ["Zero (0)", "1", "Undefined", "−2"], "correct": 2}, {"id": "c2-5-3", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(3, −2)<\/b> and <b>(3, 6)<\/b>. <span class='fmt'>Whole number or simplified fraction (or <i>undefined<\/i>).<\/span>", "hint": "slope = (y₂ − y₁) ÷ (x₂ − x₁). Start with the same point on top and bottom.", "explain": "Both points have x = 3, so the run is 3 − 3 = 0. You can't divide by zero, so the slope is <b>undefined<\/b> (a vertical line).", "ansText": "undefined", "fast": 40, "ans": {"undef": true}, "allowUndef": true}, {"id": "c2-5-4", "skill": "twopts", "type": "num", "prompt": "Find the slope of the line through <b>(−5, 2)<\/b> and <b>(4, 2)<\/b>. <span class='fmt'>Whole number or simplified f   var got = picks[i]; if (got.t === 'pts') S.score += 100; else S.bag[got.t]++;
  sfx.gift();
  document.querySelectorAll('.crate').forEach(function (c, j) { c.className = 'crate open'; c.innerHTML = picks[j].s; c.style.pointerEvents = 'none'; if (j === i) c.style.boxShadow = '0 0 0 4px #f08a24'; });
  $('#nc').disabled = false; updHud();
}
function nextCamp() { S.ci++; S.qi = 0; if (S.ci >= K.camps.length) return finale(); campIntro(); }

/* ------------------------------------------------------------ finale + report */
function finale() {
  S.screen = 'finale'; sfx.fan(); clearInterval(tInt);
  stage('<div class="card center"><div class="big-emoji">🎉</div><h1>' + K.story.finale_title + '</h1><div class="beat" style="text-align:left">' + K.story.finale + '</div>' +
    '<div class="sidekick"><div class="face">' + SIDE.emoji + '</div><div style="text-align:left"><b>' + SIDE.name + ':</b> “' + SIDE.line + ' Great job, ' + S.name + '!”</div></div>' +
    '<button class="btn" data-act="report">See my report card ▶</button></div>');
}
function tally() {
  var all = [], t = 0, first = 0, sec = 0;
  K.camps.forEach(function (c, ci) { c.questions.forEach(function (q) { var s = S.stats[q.id]; all.push({ q: q, s: s, ci: ci }); if (s) { t += s.time; if (s.first) first++; } }); });
  var answered = all.filter(function (x) { return x.s; }).length;
  return { all: all, time: t, first: first, answered: answered, pct: answered ? first / answered : 0 };
}
function report() {
  S.screen = 'report'; clearInterval(tInt);
  var T = tally(), pct = Math.round(T.pct * 100);
  var rank = pct >= 90 ? ['🏔️', 'Summit Legend'] : pct >= 75 ? ['🥇', 'Peak Ranger'] : pct >= 55 ? ['🥈', 'Trail Ranger'] : ['🥉', 'Base Camp Cadet'];
  // per-camp table
  var campRows = K.camps.map(function (c, i) { var st = S.camp[i] || campStats(i); return '<tr><td>' + c.icon + ' ' + c.name + '</td><td>' + '⭐'.repeat(st.stars) + '</td><td>' + st.first + '/' + st.n + '</td><td>' + mmss(st.time) + '</td></tr>'; }).join('');
  // per-skill table
  var sk = {}; T.all.forEach(function (x) { if (!x.s) return; var k = x.q.skill; sk[k] = sk[k] || { n: 0, f: 0 }; sk[k].n++; if (x.s.first) sk[k].f++; });
  var skRows = Object.keys(sk).map(function (k) { var a = sk[k]; return '<tr><td>' + SK[k][0] + '</td><td>' + a.f + '/' + a.n + '</td><td>' + Math.round(100 * a.f / a.n) + '%</td></tr>'; }).join('');
  var weakest = null, wp = 2; Object.keys(sk).forEach(function (k) { var p = sk[k].f / sk[k].n; if (p < wp) { wp = p; weakest = k; } });
  // badges
  var perfectCamp = K.camps.some(function (c, i) { var st = S.camp[i] || campStats(i); return st.n >= 4 && st.first === st.n; });
  var sharp = Object.keys(sk).some(function (k) { return sk[k].n >= 3 && sk[k].f === sk[k].n; });
  var unused = S.bag.compass + S.bag.rope + S.bag.boost;
  var bd = [['🏁', 'Made it to the end', T.answered === TOTAL],
            ['⭐', 'Perfect camp', perfectCamp],
            ['🔥', 'Streak of 5', S.best >= 5],
            ['⚡', 'Speed climber (5+ speed bonuses)', S.speedN >= 5],
            ['🧠', 'Slope master (90%+)', pct >= 90],
            ['🎯', 'Sharp eye (a whole skill, no misses)', sharp],
            ['🧗', 'Never gave up (3+ comebacks)', S.recov >= 3],
            ['🎒', 'Light pack (3+ power-ups unused)', unused >= 3]];
  if (K.badges === 'quiz') bd = [['🏁', 'Made it to the end', T.answered === TOTAL], ['🔥', 'Streak of 4', S.best >= 4], ['🧠', 'Slope master (90%+)', pct >= 90], ['🌟', 'Golden gate (first try)', S.goldenOk]];
  var bdH = bd.map(function (b) { return '<div class="badge' + (b[2] ? '' : ' off') + '"><span class="e">' + b[0] + '</span>' + b[1] + '</div>'; }).join('');
  var missed = T.all.filter(function (x) { return x.s && !x.s.first; });
  var missH = missed.length ? missed.map(function (x) { return '<div class="missed"><b>' + campOf(x.ci).name + ' · ' + x.q.id + '</b> — ' + strip(x.q.prompt).slice(0, 110) + '…<br><span style="color:var(--pine)"><b>Answer:</b> ' + x.q.ansText + '</span></div>'; }).join('') : '<p>🌟 No misses! Perfect climb!</p>';
  stage('<div class="card"><div style="text-align:center"><div class="big-emoji">' + rank[0] + '</div><div class="rank">' + rank[1] + '</div><p class="sub">' + K.story.title + ' · ' + S.av + ' ' + S.name + '</p></div>' +
    '<div class="stats"><div class="stat"><b>' + commas(S.score) + ' m</b><span>total altitude</span></div><div class="stat"><b>' + pct + '%</b><span>first-try accuracy</span></div><div class="stat"><b>' + S.best + '</b><span>best streak</span></div><div class="stat"><b>' + mmss(T.time) + '</b><span>solving time</span></div></div>' +
    '<h2>Camps</h2><table class="rep"><tr><th>Camp</th><th>Stars</th><th>First try</th><th>Time</th></tr>' + campRows + '</table>' +
    '<h2>Skills</h2><table class="rep"><tr><th>Skill</th><th>First try</th><th>%</th></tr>' + skRows + '</table>' +
    (weakest && wp < 1 ? '<div class="sidekick"><div class="face">' + SIDE.emoji + '</div><div><b>Next-climb tip — ' + SK[weakest][0] + ':</b> ' + SK[weakest][1] + '</div></div>' : '') +
    '<h2>Badges</h2><div class="badges">' + bdH + '</div><h2>Questions to review</h2>' + missH +
    '<div class="row center" style="margin-top:14px"><button class="btn ghost" data-act="gear">⚙️ Tutor controls</button></div></div>');
}

/* ------------------------------------------------------------ tutor controls */
function gearOpen() {
  var cs = K.camps.map(function (c, i) { return '<option value="' + i + '"' + (i === S.ci ? ' selected' : '') + '>' + (i + 1) + '. ' + c.name + '</option>'; }).join('');
  var m = $('#modal'); m.className = 'on';
  m.innerHTML = '<div class="sheet"><h2 style="margin-top:0">⚙️ Tutor controls</h2>' +
    '<label class="sw"><input type="checkbox" id="snd" ' + (S.sound ? 'checked' : '') + ' style="width:22px;height:22px"> Sound effects</label>' +
    '<p><b>Jump to:</b></p><div class="row"><select id="jc">' + cs + '</select><select id="jq"></select></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn alt" data-act="jump">Go to question</button><button class="btn ghost" data-act="jumpcamp">Camp intro</button></div>' +
    '<hr style="border:0;border-top:2px solid var(--stone);margin:14px 0"><div class="row">' +
    (S.cur && !S.cur.done ? '<button class="btn ghost" data-act="tutorReveal">Show answer</button>' : '') +
    '<button class="btn ghost" data-act="tfinale">Finale</button><button class="btn ghost" data-act="report2">Report card</button><button class="btn ghost" data-act="restart">Restart</button></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" data-act="gearclose">Close</button></div></div>';
  fillJq(); $('#jc').onchange = fillJq; $('#snd').onchange = function () { S.sound = this.checked; };
}
function fillJq() { var ci = +$('#jc').value, c = K.camps[ci]; $('#jq').innerHTML = c.questions.map(function (q, i) { return '<option value="' + i + '"' + (ci === S.ci && i === S.qi ? ' selected' : '') + '>Q' + (i + 1) + '</option>'; }).join(''); }
function gearClose() { $('#modal').className = ''; $('#modal').innerHTML = ''; }

/* ------------------------------------------------------------ events */
document.addEventListener('click', function (e) {
  var hit = e.target.closest && e.target.closest('circle.hit');
  if (hit) {
    var cur = S.cur; if (!cur || cur.done || cur.q.type !== 'plot') return;
    var x = +hit.getAttribute('data-x'), y = +hit.getAttribute('data-y'); cur.pick = [x, y]; sfx.tap();
    $('.pick-layer').innerHTML = '<circle class="hitmark" cx="' + hit.getAttribute('cx') + '" cy="' + hit.getAttribute('cy') + '" r="7"/>';
    $('#pickline').innerHTML = 'Your point: (' + fmtN(x) + ', ' + fmtN(y) + ')';
    return;
  }
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.getAttribute('data-act'), cur2 = S.cur, d = t.dataset;
  switch (a) {
    case 'av': S.av = AVATARS[+d.i]; document.querySelectorAll('.av').forEach(function (b) { b.classList.remove('sel'); }); t.classList.add('sel'); sfx.tap(); break;
    case 'begin': S.name = ($('#nm').value || '').trim() || K.story.who; ac(); intro(0); break;
    case 'introNext': intro(S.introI + 1); break;
    case 'campintro': campIntro(); break;
    case 'brief': briefing(+d.i); break;
    case 'startq': S.qi = 0; startQ(); break;
    case 'key': sfx.tap(); keyPress(d.k); break;
    case 'mfield': if (cur2 && !cur2.locked[+d.i]) { cur2.active = +d.i; refreshFields(); } break;
    case 'opt': if (cur2 && !cur2.done) { document.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('sel'); }); t.classList.add('sel'); cur2.sel = +d.i; sfx.tap(); } break;
    case 'cc': if (cur2 && !cur2.done && !cur2.locked[+d.r]) { cur2.sels[+d.r] = +d.o; renderRows(); sfx.tap(); } break;
    case 'tok': if (cur2 && !cur2.done) { cur2.seq.push(d.k); renderOrder(); sfx.tap(); } break;
    case 'undo': if (cur2 && !cur2.done) { cur2.seq.pop(); renderOrder(); } break;
    case 'reset': if (cur2 && !cur2.done) { cur2.seq = []; renderOrder(); } break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'pw': usePower(d.p); break;
    case 'crate': openCrate(+d.i); break;
    case 'nextcamp': nextCamp(); break;
    case 'report': report(); break;
    case 'lab': LAB[d.w] = Math.max(-5, Math.min(5, LAB[d.w] + (+d.d))); labDraw(); sfx.tap(); break;
    case 'ttab': var pg = campOf(S.ci).briefing[S.briefI], ty = pg.types[+d.i]; document.querySelectorAll('.tbtn').forEach(function (b, i) { b.classList.toggle('on', i === +d.i); });
      $('#tview').innerHTML = ty.svg + '<div style="font-size:18px;margin-top:6px">' + ty.text + '</div>'; break;
    case 'gear': gearOpen(); break;
    case 'gearclose': gearClose(); break;
    case 'jump': S.ci = +$('#jc').value; S.qi = +$('#jq').value; gearClose(); startQ(); break;
    case 'jumpcamp': S.ci = +$('#jc').value; S.qi = 0; gearClose(); campIntro(); break;
    case 'tutorReveal': gearClose(); if (S.cur && !S.cur.done) { S.cur.tries = 2; reveal(); } break;
    case 'tfinale': gearClose(); finale(); break;
    case 'report2': gearClose(); report(); break;
    case 'restart': if (confirm('Restart from the very beginning?')) { location.reload(); } break;
  }
});
document.addEventListener('keydown', function (e) {
  if ($('#modal').className === 'on') return;
  var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') { if (e.key === 'Enter' && S.screen === 'welcome') { $('[data-act=begin]').click(); } return; }
  var cur = S.cur;
  if (e.key === 'Enter') { var n = $('#nxt'); if (n) n.click(); else if (cur && !cur.done) check(); else { var b = $('.btn[data-act]'); } return; }
  if (!cur || cur.done) return;
  if (/^[0-9]$/.test(e.key)) keyPress(e.key); else if (e.key === '-') keyPress('-'); else if (e.key === '/') keyPress('/'); else if (e.key === 'Backspace') keyPress('back');
});

/* ------------------------------------------------------------ boot */
$('#hud .brand').innerHTML = K.story.title + '<small>' + K.story.sub + '</small>';
window.__kit = { S: S, K: K };
welcome(); drawTrail();
})();
</script>
</body></html>
